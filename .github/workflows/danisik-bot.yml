name: Danisik bot

on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут (GitHub иногда задерживает запуск)
  workflow_dispatch: {}       # ручной запуск кнопкой Run workflow

permissions:
  contents: write

concurrency:
  group: danisik-bot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install
        run: |
          pip install -r bot/requirements.txt
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Fetch messages from Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python bot/danisik_bot.py --once

      - name: Commit inbox
        run: |
          git config user.name "danisik-bot"
          git config user.email "danisik-bot@users.noreply.github.com"
          git add inbox
          if git diff --cached --quiet; then
            echo "Новых сообщений нет"
          else
            git commit -q -m "inbox: новые сообщения из Телеграма"
            git pull -q --rebase && git push -q
          fi
